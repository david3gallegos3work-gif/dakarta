# Compila Dakarta en la nube y publica el APK y el .exe en Releases.
# Solo a mano (Actions → "Compilar" → Run workflow) o con: gh workflow run compilar.yml -f plataforma=ambas
name: Compilar

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: Qué compilar
        type: choice
        options: [ambas, android, windows]
        default: ambas

# Para publicar en Releases (enlace fijo que se descarga directo en el celular).
permissions:
  contents: write

jobs:
  windows:
    if: inputs.plataforma != 'android'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri icon assets/icono.png
      - run: npx tauri build --bundles nsis
      - name: Publicar el instalador
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/bundle/nsis/*.exe Dakarta-Windows.exe
          gh release create "v$V" --title "Dakarta $V" --notes "Celular Android: descarga Dakarta.apk. Windows: descarga Dakarta-Windows.exe." 2>/dev/null || true
          gh release upload "v$V" Dakarta-Windows.exe --clobber

  android:
    if: inputs.plataforma != 'windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      # El proyecto Android se genera aquí en cada compilación (no se guarda en el repositorio).
      - run: npx tauri android init --ci
      # La barra de Dakarta es azul (u oscura de noche): hora, batería y señal en blanco.
      - run: |
          f=$(find src-tauri/gen/android -name MainActivity.kt)
          sed -i 's/enableEdgeToEdge()/enableEdgeToEdge(androidx.activity.SystemBarStyle.dark(0), androidx.activity.SystemBarStyle.dark(0))/' "$f"
          grep -q 'SystemBarStyle.dark' "$f" || { echo "::error::No se pudo ajustar la barra de estado"; cat "$f"; exit 1; }
      - run: npx tauri icon assets/icono.png
      - name: Compilar el APK
        run: |
          # MuPDF genera su enlace con Rust leyendo los encabezados de Android que trae el NDK
          # (el NDK exige la versión mínima de Android en el destino: 24, la misma de Tauri).
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=aarch64-linux-android24"
          npx tauri android build --apk --target aarch64
      - name: Firmar el APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Faltan los secretos ANDROID_KEYSTORE y ANDROID_KEYSTORE_PASSWORD (clave de firma)"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/dakarta.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/alineado.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/dakarta.jks" --ks-pass env:KS_PASS --out Dakarta.apk "$RUNNER_TEMP/alineado.apk"
      - name: Publicar el APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release create "v$V" --title "Dakarta $V" --notes "Celular Android: descarga Dakarta.apk. Windows: descarga Dakarta-Windows.exe." 2>/dev/null || true
          gh release upload "v$V" Dakarta.apk --clobber
