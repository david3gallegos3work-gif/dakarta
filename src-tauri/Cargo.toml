[package]
name = "dakarta"
version = "0.1.6"
description = "Dakarta: lector de PDF sin anuncios"
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[lib]
name = "dakarta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
tauri = "2.12.5"
tauri-plugin-dialog = "2.8"
# En Android abre el PDF que llega como content:// (WhatsApp, Descargas…) sin copiarlo entero.
tauri-plugin-fs = "2.7"
# Abre en el navegador la descarga de una versión nueva.
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
# Motor PDF: MuPDF de Artifex Software (AGPL). Sin OCR ni JavaScript por ahora: compila más rápido y la app pesa menos.
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
# MuPDF solo entrega PNG; JPEG pesa ~10 veces menos y llega más rápido a la pantalla.
jpeg-encoder = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
